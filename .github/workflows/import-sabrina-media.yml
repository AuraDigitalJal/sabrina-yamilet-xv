name: Preparar animación MP4 de Sabrina
on:
  push:
    paths:
      - '.github/workflows/import-sabrina-media.yml'
permissions:
  contents: write
jobs:
  convertir:
    if: github.event.head_commit.message == 'Preparar formato MP4 de Sabrina'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar formato HTML5 sin perder calidad
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y -i assets/apertura-sabrina.mov -c:v copy -an -movflags +faststart assets/apertura-sabrina.mp4
          test "$(wc -c < assets/apertura-sabrina.mp4)" -gt 100000
          file assets/apertura-sabrina.mp4
      - name: Guardar video compatible
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/apertura-sabrina.mp4
          git commit -m "Agregar animación MP4 compatible con móviles" || exit 0
          git push
